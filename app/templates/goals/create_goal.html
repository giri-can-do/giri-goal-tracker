{% extends "base.html" %}

{% block title %}Create Goal | Goal Tracker{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-page-header">
        <p class="page-eyebrow">GOALS / CREATE</p>
        <h1>Create Goal</h1>
        <p class="page-description">
            Define what you want to achieve.
        </p>
    </div>

    <form method="POST" class="form-card">

        <div class="form-group">
            <label for="title">Goal Name <span class="required">*</span></label>

            <input
                id="title"
                type="text"
                name="title"
                placeholder="Read 8 books"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                rows="3"
                placeholder="Why is this goal important?"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="category">Category</label>

            <input
                id="category"
                type="text"
                name="category"
                placeholder="Reading"
            >
        </div>

        <div class="form-group">
            <label for="goal_type">Goal Type <span class="required">*</span></label>

            <select id="goal_type" name="goal_type" required>
                <option value="">Select goal type</option>
                <option value="target">Target</option>
                <option value="habit">Habit</option>
                <option value="project">Project</option>
            </select>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="target_value">Target</label>

                <input
                    id="target_value"
                    type="number"
                    name="target_value"
                    step="any"
                    min="0"
                    placeholder="8"
                >
            </div>

            <div class="form-group">
                <label for="unit">Unit</label>

                <input
                    id="unit"
                    type="text"
                    name="unit"
                    placeholder="books"
                >
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="start_date">Start Date <span class="required">*</span></label>

                <input
                    id="start_date"
                    type="date"
                    name="start_date"
                    value="{{ today.isoformat() }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="deadline">Deadline</label>

                <input
                    id="deadline"
                    type="date"
                    name="deadline"
                >
            </div>

        </div>

        <div class="form-actions">

            <a
                href="{{ url_for('goals.index') }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button type="submit" class="primary-button">
                Create Goal
            </button>

        </div>

    </form>

</section>

{% endblock %}
