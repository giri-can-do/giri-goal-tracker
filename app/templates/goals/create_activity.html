{% extends "base.html" %}

{% block title %}Add Activity | Goal Tracker{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-page-header">
        <p class="page-eyebrow">GOALS / CREATE ACTIVITY</p>

        <h1>Add Activity</h1>

        <p class="page-description">
            Create an activity for
            <strong>{{ goal.title }}</strong>.
        </p>
    </div>

    <form method="POST" class="form-card">

        <div class="form-group">
            <label for="title">
                Activity Name <span class="required">*</span>
            </label>

            <input
                id="title"
                type="text"
                name="title"
                placeholder="Read 10 pages"
                required
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="start_date">
                    Start Date <span class="required">*</span>
                </label>

                <input
                    id="start_date"
                    type="date"
                    name="start_date"
                    value="{{ goal.start_date.isoformat() }}"
                    min="{{ goal.start_date.isoformat() }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="frequency">
                    Frequency <span class="required">*</span>
                </label>

                <select id="frequency" name="frequency" required>
                    <option value="daily">Every Day</option>
                    <option value="weekdays">Weekdays</option>
                    <option value="weekends">Weekends</option>
                </select>
            </div>

        </div>

        <div class="form-group">
            <label for="measurement_type">
                How do you track it?
                <span class="required">*</span>
            </label>

            <select
                id="measurement_type"
                name="measurement_type"
                required
            >
                <option value="">Select measurement type</option>
                <option value="boolean">
                    Complete / Not Complete
                </option>
                <option value="numeric">
                    Number
                </option>
                <option value="duration">
                    Duration
                </option>
            </select>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="target_value">
                    Target
                </label>

                <input
                    id="target_value"
                    type="number"
                    name="target_value"
                    min="0"
                    step="any"
                    placeholder="10"
                >
            </div>

            <div class="form-group">
                <label for="unit">
                    Unit
                </label>

                <input
                    id="unit"
                    type="text"
                    name="unit"
                    placeholder="pages"
                >
            </div>

        </div>

        <div class="form-actions">

            <a
                href="{{ url_for('goals.index') }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button type="submit" class="primary-button">
                Add Activity
            </button>

        </div>

    </form>

</section>

{% endblock %}
