{% extends "base.html" %}

{% block title %}Edit Goal | Goal Tracker{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-page-header">
        <p class="page-eyebrow">GOALS / EDIT</p>
        <h1>Edit Goal</h1>
        <p class="page-description">
            Update your goal details.
        </p>
    </div>

    <form method="POST" class="form-card">

        <div class="form-group">
            <label for="title">Goal Name <span class="required">*</span></label>

            <input
                id="title"
                type="text"
                name="title"
                value="{{ goal.title }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                rows="3"
            >{{ goal.description or "" }}</textarea>
        </div>

        <div class="form-group">
            <label for="category">Category</label>

            <input
                id="category"
                type="text"
                name="category"
                value="{{ goal.category or '' }}"
            >
        </div>

        <div class="form-group">
            <label for="goal_type">Goal Type <span class="required">*</span></label>

            <select id="goal_type" name="goal_type" required>

                <option value="target"
                    {% if goal.goal_type == "target" %}selected{% endif %}>
                    Target
                </option>

                <option value="habit"
                    {% if goal.goal_type == "habit" %}selected{% endif %}>
                    Habit
                </option>

                <option value="project"
                    {% if goal.goal_type == "project" %}selected{% endif %}>
                    Project
                </option>

            </select>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="target_value">Target</label>

                <input
                    id="target_value"
                    type="number"
                    name="target_value"
                    step="any"
                    min="0"
                    value="{{ goal.target_value if goal.target_value is not none else '' }}"
                >
            </div>

            <div class="form-group">
                <label for="unit">Unit</label>

                <input
                    id="unit"
                    type="text"
                    name="unit"
                    value="{{ goal.unit or '' }}"
                >
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="start_date">Start Date <span class="required">*</span></label>

                <input
                    id="start_date"
                    type="date"
                    name="start_date"
                    value="{{ goal.start_date.isoformat() }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="deadline">Deadline</label>

                <input
                    id="deadline"
                    type="date"
                    name="deadline"
                    value="{{ goal.deadline.isoformat() if goal.deadline else '' }}"
                >
            </div>

        </div>

        <div class="form-actions">

            <a
                href="{{ url_for('goals.index') }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button type="submit" class="primary-button">
                Save Changes
            </button>

        </div>

    </form>

</section>

{% endblock %}
