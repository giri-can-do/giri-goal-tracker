{% extends "base.html" %}

{% block title %}Edit Activity | Goal Tracker{% endblock %}

{% block content %}

<h1>Edit Activity</h1>

<p>
    Goal: <strong>{{ activity.goal.title }}</strong>
</p>

<form method="POST">

    <label>Activity</label>
    <input
        type="text"
        name="title"
        value="{{ activity.title }}"
        required
    >

    <br><br>

    <label for="start_date">Start Date</label>
    <input
        type="date"
        id="start_date"
        name="start_date"
        value="{{ activity.start_date.isoformat() }}"
        min="{{ activity.goal.start_date.isoformat() }}"
        required
    >
    <br><br>

    <label>How do you track it?</label>
    <select name="measurement_type" required>

        <option value="boolean"
            {% if activity.measurement_type == "boolean" %}selected{% endif %}>
            Complete / Not Complete
        </option>

        <option value="numeric"
            {% if activity.measurement_type == "numeric" %}selected{% endif %}>
            Number
        </option>

        <option value="duration"
            {% if activity.measurement_type == "duration" %}selected{% endif %}>
            Duration
        </option>

    </select>

    <br><br>

    <label>Target</label>
    <input
        type="number"
        name="target_value"
        min="0"
        step="any"
        value="{{ activity.target_value if activity.target_value is not none else '' }}"
    >

    <label>Unit</label>
    <input
        type="text"
        name="unit"
        value="{{ activity.unit or '' }}"
    >

    <br><br>

    <label>Frequency</label>
   <select name="frequency" required>
        <option value="daily"
            {% if activity.frequency == "daily" %}selected{% endif %}>
            Every Day
        </option>

        <option value="weekdays"
            {% if activity.frequency == "weekdays" %}selected{% endif %}>
            Weekdays
        </option>

        <option value="weekends"
            {% if activity.frequency == "weekends" %}selected{% endif %}>
            Weekends
        </option>
    </select>

    <br><br>

    <button type="submit">
        Save Changes
    </button>

</form>

<p>
    <a href="{{ url_for('goals.index') }}">
        Cancel
    </a>
</p>

{% endblock %}
