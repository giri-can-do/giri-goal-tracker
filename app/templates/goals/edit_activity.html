{% extends "base.html" %}

{% block title %}Edit Activity | Goal Tracker{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-page-header">
        <p class="page-eyebrow">GOALS / EDIT ACTIVITY</p>

        <h1>Edit Activity</h1>

        <p class="page-description">
            Update the activity for
            <strong>{{ activity.goal.title }}</strong>.
        </p>
    </div>

    <form method="POST" class="form-card">

        <div class="form-group">
            <label for="title">
                Activity Name <span class="required">*</span>
            </label>

            <input
                id="title"
                type="text"
                name="title"
                value="{{ activity.title }}"
                required
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="start_date">
                    Start Date <span class="required">*</span>
                </label>

                <input
                    id="start_date"
                    type="date"
                    name="start_date"
                    value="{{ activity.start_date.isoformat() }}"
                    min="{{ activity.goal.start_date.isoformat() }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="frequency">
                    Frequency <span class="required">*</span>
                </label>

                <select id="frequency" name="frequency" required>

                    <option value="daily"
                        {% if activity.frequency == "daily" %}
                            selected
                        {% endif %}
                    >
                        Every Day
                    </option>

                    <option value="weekdays"
                        {% if activity.frequency == "weekdays" %}
                            selected
                        {% endif %}
                    >
                        Weekdays
                    </option>

                    <option value="weekends"
                        {% if activity.frequency == "weekends" %}
                            selected
                        {% endif %}
                    >
                        Weekends
                    </option>

                </select>
            </div>

        </div>

        <div class="form-group">
            <label for="measurement_type">
                How do you track it?
                <span class="required">*</span>
            </label>

            <select
                id="measurement_type"
                name="measurement_type"
                required
            >

                <option value="boolean"
                    {% if activity.measurement_type == "boolean" %}
                        selected
                    {% endif %}
                >
                    Complete / Not Complete
                </option>

                <option value="numeric"
                    {% if activity.measurement_type == "numeric" %}
                        selected
                    {% endif %}
                >
                    Number
                </option>

                <option value="duration"
                    {% if activity.measurement_type == "duration" %}
                        selected
                    {% endif %}
                >
                    Duration
                </option>

            </select>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="target_value">
                    Target
                </label>

                <input
                    id="target_value"
                    type="number"
                    name="target_value"
                    min="0"
                    step="any"
                    value="{{ activity.target_value if activity.target_value is not none else '' }}"
                >
            </div>

            <div class="form-group">
                <label for="unit">
                    Unit
                </label>

                <input
                    id="unit"
                    type="text"
                    name="unit"
                    value="{{ activity.unit or '' }}"
                >
            </div>

        </div>

        <div class="form-actions">

            <a
                href="{{ url_for('goals.index') }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button type="submit" class="primary-button">
                Save Changes
            </button>

        </div>

    </form>

</section>

{% endblock %}
